<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="horti-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071915" />
      <stop offset="100%" stop-color="#0e2923" />
    </linearGradient>
    <linearGradient id="field-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172c1b" />
      <stop offset="100%" stop-color="#0f1f14" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#horti-bg)" />

  <!-- Outer Workspace Card -->
  <rect x="48" y="42" width="1104" height="591" rx="18" fill="#0b201b" stroke="#1f5143" stroke-width="2" />

  <!-- Header -->
  <rect x="48" y="42" width="1104" height="72" rx="18" fill="#10382e" />
  <rect x="48" y="96" width="1104" height="18" fill="#10382e" />
  <text x="78" y="76" fill="#ecfdf5" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700">Horticultural Weed &amp; Cabbage Object Detection Dataset</text>
  <text x="78" y="98" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12">Roboflow Bounding Box Annotation • Enrekang &amp; Parepare Field Survey • COCO / YOLO Format</text>

  <rect x="970" y="61" width="154" height="34" rx="17" fill="#065f46" stroke="#34d399" />
  <text x="992" y="82" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="12" font-weight="700">ROBOFLOW STUDIO</text>

  <!-- Left Viewport: Field Image Annotation Frame -->
  <rect x="74" y="136" width="664" height="472" rx="14" fill="url(#field-bg)" stroke="#235c4b" stroke-width="1.5" />

  <!-- Stylized Crop Furrows -->
  <g stroke="#223f27" stroke-width="14" stroke-opacity="0.6" stroke-linecap="round">
    <line x1="90" y1="220" x2="720" y2="220" />
    <line x1="90" y1="350" x2="720" y2="350" />
    <line x1="90" y1="480" x2="720" y2="480" />
  </g>

  <!-- Cabbage Clusters (Abstract Leaf Vector Circles) -->
  <g transform="translate(215, 225)">
    <circle cx="0" cy="0" r="44" fill="#166534" />
    <circle cx="-10" cy="-6" r="28" fill="#22c55e" fill-opacity="0.7" />
    <circle cx="10" cy="8" r="24" fill="#4ade80" fill-opacity="0.55" />
    <circle cx="0" cy="0" r="14" fill="#bbf7d0" fill-opacity="0.65" />
  </g>
  <g transform="translate(520, 355)">
    <circle cx="0" cy="0" r="48" fill="#166534" />
    <circle cx="-12" cy="4" r="30" fill="#22c55e" fill-opacity="0.7" />
    <circle cx="12" cy="-8" r="26" fill="#4ade80" fill-opacity="0.55" />
    <circle cx="0" cy="0" r="15" fill="#bbf7d0" fill-opacity="0.65" />
  </g>

  <!-- Weed Sprigs (Distinct Irregular Polygons) -->
  <g transform="translate(410, 240)">
    <path d="M-24,12 L-8,-22 L6,4 L24,-18 L18,16 L-4,24 Z" fill="#84cc16" fill-opacity="0.85" />
    <path d="M-12,-4 L4,-30 L12,10 Z" fill="#bef264" fill-opacity="0.7" />
  </g>
  <g transform="translate(260, 465)">
    <path d="M-28,16 L-12,-28 L4,2 L26,-20 L20,22 L-8,26 Z" fill="#eab308" fill-opacity="0.8" />
    <path d="M-14,0 L0,-24 L14,8 Z" fill="#fde047" fill-opacity="0.65" />
  </g>

  <!-- Bounding Box 1: Cabbage_Crop -->
  <rect x="158" y="170" width="114" height="110" fill="#22c55e" fill-opacity="0.1" stroke="#4ade80" stroke-width="2.5" />
  <rect x="158" y="144" width="134" height="24" rx="4" fill="#16a34a" />
  <text x="166" y="160" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Cabbage_Crop 0.96</text>

  <!-- Bounding Box 2: Weed_Broadleaf -->
  <rect x="372" y="198" width="84" height="76" fill="#f59e0b" fill-opacity="0.12" stroke="#fbbf24" stroke-width="2.5" />
  <rect x="372" y="172" width="144" height="24" rx="4" fill="#d97706" />
  <text x="380" y="188" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Broadleaf_Weed 0.94</text>

  <!-- Bounding Box 3: Cabbage_Crop -->
  <rect x="460" y="296" width="122" height="118" fill="#22c55e" fill-opacity="0.1" stroke="#4ade80" stroke-width="2.5" />
  <rect x="460" y="270" width="134" height="24" rx="4" fill="#16a34a" />
  <text x="468" y="286" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Cabbage_Crop 0.98</text>

  <!-- Bounding Box 4: Grass_Weed -->
  <rect x="218" y="424" width="90" height="78" fill="#ef4444" fill-opacity="0.12" stroke="#f87171" stroke-width="2.5" />
  <rect x="218" y="398" width="124" height="24" rx="4" fill="#dc2626" />
  <text x="226" y="414" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Grass_Weed 0.91</text>

  <!-- Viewport Footer Status -->
  <rect x="92" y="544" width="628" height="46" rx="10" fill="#091914" stroke="#1f5143" />
  <text x="110" y="572" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="12">Ground Truth Check: Tight-fit BBox • Natural Tropical Illumination</text>

  <!-- Right Panel: Taxonomy & Pipeline -->
  <rect x="760" y="136" width="368" height="244" rx="14" fill="#0f2922" stroke="#1f5143" stroke-width="1.5" />
  <text x="782" y="168" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Multi-Class Label Taxonomy</text>
  <text x="782" y="188" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">Curated Field Imagery + Bounding Box</text>

  <!-- Class Bars -->
  <text x="782" y="222" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12">Cabbage_Crop (Primary Target)</text>
  <rect x="782" y="232" width="320" height="10" rx="5" fill="#133d32" />
  <rect x="782" y="232" width="245" height="10" rx="5" fill="#22c55e" />

  <text x="782" y="268" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12">Weed_Broadleaf (Competitive)</text>
  <rect x="782" y="278" width="320" height="10" rx="5" fill="#133d32" />
  <rect x="782" y="278" width="198" height="10" rx="5" fill="#f59e0b" />

  <text x="782" y="314" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12">Weed_Cyperus / Grass</text>
  <rect x="782" y="324" width="320" height="10" rx="5" fill="#133d32" />
  <rect x="782" y="324" width="160" height="10" rx="5" fill="#f87171" />

  <!-- Bottom Right Panel: Augmentation & Export -->
  <rect x="760" y="398" width="368" height="210" rx="14" fill="#0f2922" stroke="#1f5143" stroke-width="1.5" />
  <text x="782" y="430" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Augmentation &amp; Export Pipeline</text>

  <rect x="782" y="450" width="152" height="62" rx="10" fill="#12342b" stroke="#226856" />
  <text x="796" y="476" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">Augmentation</text>
  <text x="796" y="496" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Rotation • Shear • Lux</text>

  <rect x="950" y="450" width="154" height="62" rx="10" fill="#12342b" stroke="#226856" />
  <text x="964" y="476" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="13" font-weight="700">Train-Ready</text>
  <text x="964" y="496" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">COCO JSON • YOLO</text>

  <rect x="782" y="528" width="322" height="58" rx="10" fill="#12342b" stroke="#226856" />
  <text x="798" y="553" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Workflow: Collect → Annotate → Export</text>
  <text x="798" y="572" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">Precision Weed Detection Research Corpus</text>
</svg>
