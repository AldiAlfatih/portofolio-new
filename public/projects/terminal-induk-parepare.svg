<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e" />
      <stop offset="100%" stop-color="#0d1f36" />
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b60b0" />
      <stop offset="100%" stop-color="#1282a2" />
    </linearGradient>
    <linearGradient id="route-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Subtle Grid -->
  <g stroke="#1e3a5f" stroke-opacity="0.25" stroke-width="1">
    <path d="M0 135 H1200 M0 270 H1200 M0 405 H1200 M0 540 H1200" />
    <path d="M200 0 V675 M400 0 V675 M600 0 V675 M800 0 V675 M1000 0 V675" />
  </g>

  <!-- Main Browser Frame -->
  <rect x="48" y="42" width="1104" height="591" rx="18" fill="#0c192c" stroke="#24466e" stroke-width="2" />

  <!-- Top Header Strip -->
  <path d="M48 60 C48 50 56 42 66 42 H1134 C1144 42 1152 50 1152 60 V110 H48 Z" fill="url(#header-grad)" />
  <circle cx="78" cy="76" r="6" fill="#ef4444" />
  <circle cx="98" cy="76" r="6" fill="#f59e0b" />
  <circle cx="118" cy="76" r="6" fill="#10b981" />

  <text x="148" y="73" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Terminal Induk Parepare — Live Transit Telemetry</text>
  <text x="148" y="94" fill="#bae6fd" font-family="ui-monospace, monospace" font-size="12">Laravel 12 • React 19 • Inertia.js • Laravel Reverb WebSocket (&lt;500ms)</text>

  <!-- Live Status Pill -->
  <rect x="944" y="59" width="184" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <circle cx="966" cy="76" r="5" fill="#34d399" filter="url(#glow)" />
  <text x="980" y="80" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="12" font-weight="700">REVERB LIVE SYNC</text>

  <!-- Left Panel: Leaflet Live Map Viewport -->
  <rect x="72" y="132" width="635" height="477" rx="14" fill="#091524" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Map Streets / Road Network -->
  <g stroke="#1b3452" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M90 240 L290 240 L430 340 L690 340" />
    <path d="M180 150 L240 370 L390 540" />
    <path d="M510 150 L430 340 L560 580" />
    <path d="M90 480 L380 420 L680 470" />
  </g>
  <g stroke="#294c75" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <path d="M90 240 L290 240 L430 340 L690 340" />
  </g>

  <!-- Active Transit Route -->
  <path d="M128 455 Q 250 385, 365 305 T 640 205" stroke="url(#route-grad)" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)" />

  <!-- Terminal Origin Node -->
  <circle cx="128" cy="455" r="14" fill="#0b60b0" stroke="#93c5fd" stroke-width="3" />
  <rect x="96" y="476" width="150" height="26" rx="6" fill="#0f253e" stroke="#3b82f6" />
  <text x="108" y="493" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="11" font-weight="700">TERMINAL INDUK</text>

  <!-- Moving Bus Marker 1 -->
  <g transform="translate(365, 305)">
    <circle cx="0" cy="0" r="24" fill="#38bdf8" fill-opacity="0.18" />
    <circle cx="0" cy="0" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)" />
    <polygon points="0,-18 -5,-10 5,-10" fill="#34d399" />
  </g>
  <rect x="386" y="274" width="136" height="44" rx="8" fill="#0f253e" stroke="#38bdf8" stroke-width="1.2" />
  <text x="398" y="293" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">BUS DD-7712 (MKS)</text>
  <text x="398" y="309" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">58 km/h • 148° SE</text>

  <!-- Moving Bus Marker 2 -->
  <g transform="translate(565, 224)">
    <circle cx="0" cy="0" r="18" fill="#10b981" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  </g>
  <rect x="502" y="170" width="138" height="36" rx="8" fill="#0f253e" stroke="#10b981" stroke-width="1" />
  <text x="513" y="192" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ARMADA-09 • ETA 12m</text>

  <!-- Map Top Overlay Chip -->
  <rect x="92" y="152" width="236" height="34" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" />
  <text x="108" y="173" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Leaflet.js &amp; OpenStreetMap Layer</text>

  <!-- Telemetry Overlay Bar Bottom of Map -->
  <rect x="92" y="526" width="595" height="64" rx="10" fill="#0f2036" stroke="#24466e" />
  <text x="112" y="549" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">DRIVER GPS TELEMETRY</text>
  <text x="112" y="572" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">-4.0135° S, 119.6255° E</text>

  <line x1="340" y1="538" x2="340" y2="578" stroke="#24466e" />
  <text x="360" y="549" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">KECEPATAN &amp; KOMPAS</text>
  <text x="360" y="572" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="15" font-weight="700">58 km/h | Bearing 148°</text>

  <line x1="565" y1="538" x2="565" y2="578" stroke="#24466e" />
  <text x="582" y="549" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">BROADCAST</text>
  <text x="582" y="572" fill="#34d399" font-family="ui-monospace, monospace" font-size="15" font-weight="700">240 ms</text>

