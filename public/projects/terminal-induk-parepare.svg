  <text x="764" y="224" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Parepare → Makassar</text>
  <text x="764" y="243" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">PO Bintang Prima • Jalur 01</text>
  <rect x="996" y="213" width="96" height="24" rx="12" fill="#064e3b" />
  <text x="1014" y="229" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ON TIME</text>

  <rect x="748" y="270" width="360" height="58" rx="10" fill="#132944" stroke="#1e3a5f" />
  <text x="764" y="294" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Parepare → Palopo</text>
  <text x="764" y="313" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">PO Litha &amp; Co • Jalur 03</text>
  <rect x="988" y="283" width="104" height="24" rx="12" fill="#1e3a8a" />
  <text x="1003" y="299" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="11" font-weight="700">BOARDING</text>

  <rect x="748" y="340" width="360" height="58" rx="10" fill="#132944" stroke="#1e3a5f" />
  <text x="764" y="364" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Parepare → Mamuju</text>
  <text x="764" y="383" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">PO Piposs • Jalur 02</text>
  <rect x="988" y="353" width="104" height="24" rx="12" fill="#451a03" />
  <text x="1003" y="369" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">EN ROUTE</text>

  <text x="750" y="426" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">Syncing WebSocket channel: terminal.parepare.live</text>

  <!-- Right Panel Bottom: Dishub PDF Governance -->
  <rect x="728" y="462" width="400" height="147" rx="14" fill="#0e1e33" stroke="#24466e" stroke-width="1.5" />
  <text x="750" y="492" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Admin Panel &amp; Dishub PDF Reporting</text>
  <text x="750" y="512" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Verifikasi Izin Trayek, Audit Kehadiran &amp; Ekspor PDF</text>

  <rect x="750" y="532" width="112" height="56" rx="10" fill="#132944" stroke="#1e3a5f" />
  <text x="764" y="556" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="16" font-weight="700">RBAC</text>
  <text x="764" y="575" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">Multi-Role</text>

  <rect x="872" y="532" width="112" height="56" rx="10" fill="#132944" stroke="#1e3a5f" />
  <text x="886" y="556" fill="#34d399" font-family="ui-monospace, monospace" font-size="16" font-weight="700">DomPDF</text>
  <text x="886" y="575" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">Resmi Dishub</text>

  <rect x="994" y="532" width="114" height="56" rx="10" fill="#132944" stroke="#1e3a5f" />
  <text x="1008" y="556" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="16" font-weight="700">MySQL</text>
  <text x="1008" y="575" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">Audit Log</text>
</svg>
