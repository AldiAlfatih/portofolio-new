  <text x="750" y="164" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Public Schedule Board</text>
  <text x="750" y="182" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="11">Automated ETA Display — Kota Parepare</text>

