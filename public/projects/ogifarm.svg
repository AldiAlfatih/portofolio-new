  <text x="824" y="520" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="12">Offline Cache → Supabase Sync</text>
  <text x="808" y="574" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="11">REST API • Auth • Real-time DB</text>
